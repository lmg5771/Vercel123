<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到我的全新网页</title>
    <style>
        /* 全局现代样式重置 */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-color: #3b82f6;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* 导航栏样式 */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: 500;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }

        /* 主体布局 */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* 英雄横幅区域 */
        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border-radius: 1rem;
            margin-bottom: 2rem;
        }
        [data-theme="dark"] .hero {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e293b 100%);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        /* 特性卡片栅格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <header>
        <div class="nav-container">
            <div class="logo">🚀 MyWebSpace</div>
            <div class="nav-actions">
                <button id="theme-toggle">🌗 切换模式</button>
                <button class="btn-primary" onclick="alert('感谢点击！')">立即开始</button>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main>
        <!-- 横幅区 -->
        <section class="hero">
            <h1>开启您的全新数字体验</h1>
            <p>这是一个纯 HTML 网页模板，已内置极简响应式设计与暗黑模式。</p>
        </section>

        <!-- 卡片区 -->
        <section class="grid">
            <div class="card">
                <h3>⚡ 纯净代码</h3>
                <p>无任何外部依赖，加载极速，完美符合您的纯 HTML 需求。</p>
            </div>
            <div class="card">
                <h3>🎨 现代化样式</h3>
                <p>采用 Flexbox 与 Grid 响应式布局，完美适配手机、平板及电脑。 </p>
            </div>
            <div class="card">
                <h3>🌓 动态夜间模式</h3>
                <p>点击右上角按钮，即可体验无缝丝滑的深色主题切换。 </p>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 MyWebSpace. 保留所有权利。</p>
    </footer>

    <!-- 交互脚本 -->
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // 监听按钮点击切换主题
        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                htmlElement.removeAttribute('data-theme');
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
            }
        });
    </script>
</body>
</html>
